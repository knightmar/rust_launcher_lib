[package]
name = "rust_launcher_lib"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A rust library that aims to make launchers for the game Minecraft"
homepage = "https://github.com/knightmar/rust_launcher_lib"
readme = "README.md"
keywords = ["minecraft", "launcher", "tool", "java"]
categories = ["game-development", "games"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
reqwest = { version = "0.13.4", features = ["form", "json"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }
open = "5.4.1"
tiny_http = "0.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_derive = "1.0.229"
rsa = "0.9"
sha2 = { version = "0.10", features = ["oid"] }
base64 = "0.23.1"
rand = "0.10.2"


[dev-dependencies]
dotenv = "0.15.0"