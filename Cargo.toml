[package]
name = "rust_launcher_lib"
version = "2.0.0"
edition = "2024"
license = "MIT"
description = "A rust library that aims to make launchers for the game Minecraft"
homepage = "https://github.com/knightmar/rust_launcher_lib"
repository = "https://github.com/knightmar/rust_launcher_lib"
readme = "README.md"
keywords = ["minecraft", "launcher", "tool", "java"]
categories = ["game-development", "games"]

[dependencies]
reqwest = { version = "0.13.4", features = ["form", "json", "stream"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "fs", "rt", "macros"] }
open = "5.4.1"
tiny_http = "0.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_derive = "1.0.229"
rsa = "0.9"
sha2 = { version = "0.10", features = ["oid"] }
sha1 = "0.11.0"
base64 = "0.23.1"
rand = "0.10.2"
futures-util = "0.3.34"
hex = "0.4.3"
zip = "9.0.0-pre3"
walkdir = "2.5.0"
thiserror = "2"

[lib]
name = "rust_launcher_lib"
path = "src/lib.rs"

[dev-dependencies]
dotenv = "0.15.0"
